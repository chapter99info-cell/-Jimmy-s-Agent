    <style>
      /* === PTM Interactive Features (additive only) === */
      #ptm-loader {
        position: fixed;
        inset: 0;
        z-index: 100000;
        background: #f5effa;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transition: opacity 0.5s ease;
      }
      #ptm-loader.ptm-loader-hide {
        opacity: 0;
        pointer-events: none;
      }
      #ptm-loader-text {
        font-family: 'Libre Baskerville', 'Playfair Display', Georgia, serif;
        font-size: clamp(1.25rem, 4vw, 2rem);
        letter-spacing: 0.35em;
        color: #2d1b40;
        text-transform: uppercase;
        font-weight: 700;
      }
      #ptm-loader-line {
        width: 140px;
        height: 2px;
        margin-top: 14px;
        background: #d4a853;
        transform: scaleX(0);
        transform-origin: left center;
        animation: ptm-gold-draw 1.2s cubic-bezier(0.4, 0, 0.2, 1) 0.4s forwards;
      }
      @keyframes ptm-gold-draw {
        to { transform: scaleX(1); }
      }

      #ptm-scroll-progress {
        position: fixed;
        top: 0;
        left: 0;
        height: 2px;
        width: 0%;
        background: #9c77b7;
        z-index: 99999;
        pointer-events: none;
      }

      #ptm-cursor-dot,
      #ptm-cursor-ring {
        position: fixed;
        top: 0;
        left: 0;
        pointer-events: none;
        z-index: 99998;
        transform: translate(-50%, -50%);
        will-change: transform, left, top;
      }
      #ptm-cursor-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #9c77b7;
      }
      #ptm-cursor-ring {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: 1.5px solid rgba(156, 119, 183, 0.85);
        background: transparent;
      }
      @media (max-width: 768px) {
        #ptm-cursor-dot,
        #ptm-cursor-ring {
          display: none !important;
        }
      }
      @media (min-width: 769px) {
        body.ptm-cursor-on {
          cursor: none;
        }
        body.ptm-cursor-on a,
        body.ptm-cursor-on button {
          cursor: none;
        }
      }

      #ptm-ripple-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 2;
      }

      .ptm-card-reveal {
        opacity: 0 !important;
        transform: translateY(28px) !important;
        transition: opacity 0.65s ease, transform 0.65s ease !important;
      }
      .ptm-card-reveal.ptm-card-visible {
        opacity: 1 !important;
        transform: translateY(0) !important;
      }

      #ptm-duration-toggle {
        display: flex;
        gap: 8px;
        margin-bottom: 1.5rem;
        pointer-events: auto;
      }
      #ptm-duration-toggle button {
        padding: 10px 22px;
        border-radius: 9999px;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        border: 1px solid rgba(156, 119, 183, 0.2);
        background: #fdfbff;
        color: rgba(45, 27, 64, 0.7);
        cursor: pointer;
        transition: background 0.3s, color 0.3s, box-shadow 0.3s, transform 0.3s;
      }
      #ptm-duration-toggle button.ptm-dur-active {
        background: #9c77b7;
        color: #fff;
        box-shadow: 0 8px 24px rgba(156, 119, 183, 0.25);
        transform: scale(1.02);
      }
      .ptm-duration-highlight {
        box-shadow: 0 0 0 2px rgba(212, 168, 83, 0.55), 0 25px 50px -12px rgba(156, 119, 183, 0.25) !important;
      }

      #ptm-exit-popup {
        position: fixed;
        inset: 0;
        z-index: 100001;
        background: rgba(45, 27, 64, 0.45);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.35s ease;
      }
      #ptm-exit-popup.ptm-exit-show {
        opacity: 1;
        pointer-events: auto;
      }
      #ptm-exit-popup .ptm-exit-inner {
        position: relative;
        max-width: 440px;
        width: 100%;
        background: #fffdfa;
        border: 2px solid rgba(156, 119, 183, 0.2);
        border-radius: 24px;
        padding: 36px 32px 28px;
        box-shadow: 0 30px 80px rgba(45, 27, 64, 0.18);

      }

        font-size: 1.5rem;

        color: #9c77b7;
        cursor: pointer;
        padding: 0;
      }
      @media (max-width: 768px) {
        #ptm-exit-popup {
          display: none !important;
        }
      }

  <body>

    <div id="ptm-scroll-progress" aria-hidden="true"></div>

    <div id="ptm-cursor-ring" aria-hidden="true"></div>
    <div id="ptm-exit-popup" aria-hidden="true">
      <div class="ptm-exit-inner">
        <button id="ptm-exit-close" type="button" aria-label="Close">&times;</button>

    <script>
      (function () {
        'use strict';

        var GOLD = '#d4a853';
        var PURPLE = '#9c77b7';

        function lerp(a, b, t) {
          return a + (b - a) * t;
        }

        function easeOutQuart(t) {
          return 1 - Math.pow(1 - t, 4);
        }

        function waitFor(selector, timeout) {
          timeout = timeout || 20000;
          return new Promise(function (resolve, reject) {
            var start = Date.now();
            function tick() {
              var el = document.querySelector(selector);
              if (el) return resolve(el);
              if (Date.now() - start > timeout) return reject(new Error('timeout: ' + selector));
              requestAnimationFrame(tick);
            }
            tick();
          });
        }

        /* 1. Loading screen */
        (function initLoader() {
          var loader = document.getElementById('ptm-loader');
          if (!loader) return;
          setTimeout(function () {
            loader.classList.add('ptm-loader-hide');
            setTimeout(function () {
              if (loader.parentNode) loader.parentNode.removeChild(loader);
            }, 500);
          }, 2200);
        })();

        /* 3. Scroll progress bar */
        (function initScrollProgress() {
          var bar = document.getElementById('ptm-scroll-progress');
          if (!bar) return;
          function update() {
            var scrollTop = window.scrollY || document.documentElement.scrollTop;
            var docHeight = document.documentElement.scrollHeight - window.innerHeight;
            var pct = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
            bar.style.width = pct + '%';
          }
          window.addEventListener('scroll', update, { passive: true });
          update();
        })();

        /* 2. Custom cursor (desktop) */
        (function initCustomCursor() {
          var dot = document.getElementById('ptm-cursor-dot');
          var ring = document.getElementById('ptm-cursor-ring');
          if (!dot || !ring) return;

          var mouseX = window.innerWidth / 2;
          var mouseY = window.innerHeight / 2;
          var dotX = mouseX, dotY = mouseY;
          var ringX = mouseX, ringY = mouseY;
          var enabled = false;

          function checkWidth() {
            enabled = window.innerWidth > 768;
            document.body.classList.toggle('ptm-cursor-on', enabled);
            if (!enabled) {
              dot.style.display = 'none';
              ring.style.display = 'none';
            } else {
              dot.style.display = '';
              ring.style.display = '';
            }
          }
          checkWidth();
          window.addEventListener('resize', checkWidth);

          document.addEventListener('mousemove', function (e) {
            mouseX = e.clientX;
            mouseY = e.clientY;
          });

          function frame() {
            if (enabled) {
              dotX = lerp(dotX, mouseX, 0.35);
              dotY = lerp(dotY, mouseY, 0.35);
              ringX = lerp(ringX, mouseX, 0.12);
              ringY = lerp(ringY, mouseY, 0.12);
              dot.style.left = dotX + 'px';
              dot.style.top = dotY + 'px';
              ring.style.left = ringX + 'px';
              ring.style.top = ringY + 'px';
            }
            requestAnimationFrame(frame);
          }
          frame();
        })();

        /* 10. Exit intent popup */
        (function initExitIntent() {
          var popup = document.getElementById('ptm-exit-popup');
          var closeBtn = document.getElementById('ptm-exit-close');
          if (!popup) return;

          function hide() {
            popup.classList.remove('ptm-exit-show');
            popup.setAttribute('aria-hidden', 'true');
          }

          if (closeBtn) closeBtn.addEventListener('click', hide);
          popup.addEventListener('click', function (e) {
            if (e.target === popup) hide();
          });

          document.addEventListener('mouseout', function (e) {
            if (window.innerWidth <= 768) return;
            if (sessionStorage.getItem('ptm-exit-shown')) return;
            if (e.clientY <= 0 && (!e.relatedTarget || e.relatedTarget.nodeName === 'HTML')) {
              sessionStorage.setItem('ptm-exit-shown', '1');
              popup.classList.add('ptm-exit-show');
              popup.setAttribute('aria-hidden', 'false');
            }
          });
        })();

        /* App-dependent features after React mount */
        function initAppFeatures() {
          waitFor('main section').then(function () {
            var hero = document.querySelector('main > section');
            var servicesSection = document.getElementById('services');

            if (hero) initWaterRipple(hero);
            initMagneticCTA();

            if (servicesSection) {
              initStaggerReveal(servicesSection);
              initPriceCountUp(servicesSection);
              initDurationToggle(servicesSection);
            }
          }).catch(function () {});
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', initAppFeatures);
        } else {
          initAppFeatures();
        }

        /* 4. Water ripple on hero */
        function initWaterRipple(hero) {
          if (hero.querySelector('#ptm-ripple-canvas')) return;

          var canvas = document.createElement('canvas');
          canvas.id = 'ptm-ripple-canvas';
          hero.style.position = hero.style.position || '';
          if (getComputedStyle(hero).position === 'static') hero.style.position = 'relative';
          hero.appendChild(canvas);

          var ctx = canvas.getContext('2d');
          var ripples = [];
          var w = 0, h = 0;

          function resize() {
            var rect = hero.getBoundingClientRect();
            w = canvas.width = Math.floor(rect.width);
            h = canvas.height = Math.floor(rect.height);
          }
          resize();
          window.addEventListener('resize', resize);

          function addRipple(clientX, clientY) {
            var rect = hero.getBoundingClientRect();
            ripples.push({
              x: clientX - rect.left,
              y: clientY - rect.top,
              r: 4,
              alpha: 0.55
            });
          }

          hero.addEventListener('mousemove', function (e) {
            addRipple(e.clientX, e.clientY);
          });
          hero.addEventListener('touchstart', function (e) {
            if (e.touches[0]) addRipple(e.touches[0].clientX, e.touches[0].clientY);
          }, { passive: true });
          hero.addEventListener('touchmove', function (e) {
            if (e.touches[0]) addRipple(e.touches[0].clientX, e.touches[0].clientY);
          }, { passive: true });

          (function draw() {
            ctx.clearRect(0, 0, w, h);
            ripples = ripples.filter(function (r) { return r.alpha > 0.02; });
            ripples.forEach(function (r) {
              r.r += 1.8;
              r.alpha *= 0.965;
              ctx.beginPath();
              ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
              ctx.strokeStyle = 'rgba(212, 168, 83, ' + (r.alpha * 0.7) + ')';
              ctx.lineWidth = 1.5;
              ctx.stroke();
              if (r.r > 6) {
                ctx.beginPath();
                ctx.arc(r.x, r.y, r.r * 0.65, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(156, 119, 183, ' + (r.alpha * 0.35) + ')';
                ctx.lineWidth = 1;
                ctx.stroke();
              }
            });
            requestAnimationFrame(draw);
          })();
        }

        /* 5. Magnetic CTA */
        function initMagneticCTA() {
          var btn = document.querySelector('a[href="tel:0427139455"]');
          if (!btn || btn.dataset.ptmMagnetic) return;
          btn.dataset.ptmMagnetic = '1';

          var radius = 80;
          var factor = 0.35;
          var targetX = 0, targetY = 0;
          var currentX = 0, currentY = 0;
          var hovering = false;

          btn.addEventListener('mouseenter', function () { hovering = true; });
          btn.addEventListener('mouseleave', function () {
            hovering = false;
            targetX = 0;
            targetY = 0;
          });

          document.addEventListener('mousemove', function (e) {
            if (!hovering) return;
            var rect = btn.getBoundingClientRect();
            var cx = rect.left + rect.width / 2;
            var cy = rect.top + rect.height / 2;
            var dx = e.clientX - cx;
            var dy = e.clientY - cy;
            var dist = Math.hypot(dx, dy);
            if (dist < radius) {
              targetX = dx * factor;
              targetY = dy * factor;
            } else {
              targetX = 0;
              targetY = 0;
            }
          });

          (function animate() {
            var ease = hovering ? 0.2 : 0.12;
            currentX = lerp(currentX, targetX, ease);
            currentY = lerp(currentY, targetY, ease);
            btn.style.transform = 'translate(' + currentX + 'px, ' + currentY + 'px)';
            requestAnimationFrame(animate);
          })();
        }

        /* 6. Stagger reveal on service cards */
        function getServiceCards(section) {
          var container = section.querySelector('.space-y-8');
          if (!container) return [];
          return Array.prototype.slice.call(container.children);
        }

        function initStaggerReveal(section) {
          var cards = getServiceCards(section);
          if (!cards.length) return;

          var delays = [0.05, 0.18, 0.31];
          cards.forEach(function (card, i) {
            card.classList.add('ptm-card-reveal');
            card.style.transitionDelay = (delays[i % delays.length]) + 's';
          });

          var observer = new IntersectionObserver(function (entries) {
            entries.forEach(function (entry) {
              if (entry.isIntersecting) {
                entry.target.classList.add('ptm-card-visible');
                observer.unobserve(entry.target);
              }
            });
          }, { threshold: 0.12 });

          cards.forEach(function (card) { observer.observe(card); });
        }

        /* 7. Price count-up */
        function parsePrice(text) {
          var n = parseInt(String(text).replace(/[^0-9]/g, ''), 10);
          return isNaN(n) ? 0 : n;
        }

        function animatePrice(el, finalValue, duration) {
          duration = duration || 800;
          var start = null;
          function step(ts) {
            if (!start) start = ts;
            var p = Math.min((ts - start) / duration, 1);
            var val = Math.round(easeOutQuart(p) * finalValue);
            el.textContent = '$' + val;
            if (p < 1) requestAnimationFrame(step);
            else el.textContent = '$' + finalValue;
          }
          requestAnimationFrame(step);
        }

        function getPriceSpan(card) {
          var h4 = card.querySelector('h4');
          if (!h4) return null;
          var spans = h4.querySelectorAll('span');
          for (var i = 0; i < spans.length; i++) {
            if (/\$/.test(spans[i].textContent)) return spans[i];
          }
          return null;
        }

        function initPriceCountUp(section) {
          var cards = getServiceCards(section);
          cards.forEach(function (card) {
            var priceEl = getPriceSpan(card);
            if (!priceEl || priceEl.dataset.ptmCounted) return;
            var finalVal = parsePrice(priceEl.textContent);
            if (!finalVal) return;

            var observer = new IntersectionObserver(function (entries) {
              entries.forEach(function (entry) {
                if (entry.isIntersecting) {
                  priceEl.dataset.ptmCounted = '1';
                  priceEl.dataset.ptmFinal = String(finalVal);
                  animatePrice(priceEl, finalVal, 800);
                  observer.unobserve(card);
                }
              });
            }, { threshold: 0.12 });
            observer.observe(card);
          });
        }

        /* 9. Duration toggle (60min / 90min) */
        function getDurationFromCard(card) {
          var h4 = card.querySelector('h4');
          if (!h4) return '';
          var m = h4.textContent.match(/(\d+)\s*MINS/i);
          return m ? m[1] : '';
        }

        function initDurationToggle(section) {
          var cards = getServiceCards(section);
          var has60 = cards.some(function (c) { return getDurationFromCard(c) === '60'; });
          var has90 = cards.some(function (c) { return getDurationFromCard(c) === '90'; });
          if (!has60 || !has90) return;

          var container = section.querySelector('.space-y-8');
          if (!container || document.getElementById('ptm-duration-toggle')) return;

          var toggle = document.createElement('div');
          toggle.id = 'ptm-duration-toggle';
          toggle.innerHTML =
            '<button type="button" data-dur="60" class="ptm-dur-active">60min</button>' +
            '<button type="button" data-dur="90">90min</button>';
          container.parentNode.insertBefore(toggle, container);

          var activeDur = '60';

          function highlightCard(dur) {
            cards.forEach(function (card) {
              card.classList.remove('ptm-duration-highlight');
              if (getDurationFromCard(card) === dur) {
                card.classList.add('ptm-duration-highlight');
                var priceEl = getPriceSpan(card);
                if (priceEl) {
                  var finalVal = parsePrice(priceEl.dataset.ptmFinal || priceEl.textContent);
                  priceEl.dataset.ptmFinal = String(finalVal);
                  animatePrice(priceEl, finalVal, 800);
                }
              }
            });
          }

          toggle.addEventListener('click', function (e) {
            var btn = e.target.closest('button[data-dur]');
            if (!btn) return;
            activeDur = btn.getAttribute('data-dur');
            toggle.querySelectorAll('button').forEach(function (b) {
              b.classList.toggle('ptm-dur-active', b === btn);
            });
            highlightCard(activeDur);
          });

          highlightCard('60');

          var mo = new MutationObserver(function () {
            cards = getServiceCards(section);
            highlightCard(activeDur);
            initPriceCountUp(section);
          });
          mo.observe(container, { childList: true, subtree: true });
        }
      })();
    </script>
