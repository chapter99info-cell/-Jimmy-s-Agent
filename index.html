    <style>
      /* === PTM Interactive Features (additive only) === */
      #ptm-loader {
        position: fixed;
        inset: 0;
        z-index: 100000;
        background: #f5effa;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transition: opacity 0.5s ease;
      }
      #ptm-loader.ptm-loader-hide {
        opacity: 0;
        pointer-events: none;
      }
      #ptm-loader-text {
        font-family: 'Libre Baskerville', 'Playfair Display', Georgia, serif;
        font-size: clamp(1.25rem, 4vw, 2rem);
        letter-spacing: 0.35em;
        color: #2d1b40;
        text-transform: uppercase;
        font-weight: 700;
      }
      #ptm-loader-line {
        width: 140px;
        height: 2px;
        margin-top: 14px;
        background: #d4a853;
        transform: scaleX(0);
        transform-origin: left center;
        animation: ptm-gold-draw 1.2s cubic-bezier(0.4, 0, 0.2, 1) 0.4s forwards;
      }
      @keyframes ptm-gold-draw {
        to { transform: scaleX(1); }
      }

      #ptm-scroll-progress {
        position: fixed;
        top: 0;
        left: 0;
        height: 2px;
        width: 0%;
        background: #9c77b7;
        z-index: 99999;
        pointer-events: none;
      }

      #ptm-cursor-dot,
      #ptm-cursor-ring {
        position: fixed;
        top: 0;
        left: 0;
        pointer-events: none;
        z-index: 99998;
        transform: translate(-50%, -50%);
        will-change: transform, left, top;
      }
      #ptm-cursor-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #9c77b7;
      }
      #ptm-cursor-ring {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: 1.5px solid rgba(156, 119, 183, 0.85);
        background: transparent;
      }
      @media (max-width: 768px) {
        #ptm-cursor-dot,
        #ptm-cursor-ring {
          display: none !important;
        }
      }
      @media (min-width: 769px) {
        body.ptm-cursor-on {
          cursor: none;
        }
        body.ptm-cursor-on a,
        body.ptm-cursor-on button {
          cursor: none;
        }
      }

      #ptm-ripple-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 2;
      }

      .ptm-card-reveal {
        opacity: 0 !important;
        transform: translateY(28px) !important;
        transition: opacity 0.65s ease, transform 0.65s ease !important;
      }
      .ptm-card-reveal.ptm-card-visible {
        opacity: 1 !important;
        transform: translateY(0) !important;
      }

      #ptm-duration-toggle {
        display: flex;
        gap: 8px;
        margin-bottom: 1.5rem;
        pointer-events: auto;
      }
      #ptm-duration-toggle button {
        padding: 10px 22px;
        border-radius: 9999px;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        border: 1px solid rgba(156, 119, 183, 0.2);
        background: #fdfbff;
        color: rgba(45, 27, 64, 0.7);
        cursor: pointer;
        transition: background 0.3s, color 0.3s, box-shadow 0.3s, transform 0.3s;
      }
      #ptm-duration-toggle button.ptm-dur-active {
        background: #9c77b7;
        color: #fff;
        box-shadow: 0 8px 24px rgba(156, 119, 183, 0.25);
        transform: scale(1.02);
      }
      .ptm-duration-highlight {
        box-shadow: 0 0 0 2px rgba(212, 168, 83, 0.55), 0 25px 50px -12px rgba(156, 119, 183, 0.25) !important;
      }

  <body>
    <div id="ptm-loader" aria-hidden="true">
      <div id="ptm-loader-text">THE PRINCESS</div>
      <div id="ptm-loader-line"></div>
    </div>
    <div id="ptm-scroll-progress" aria-hidden="true"></div>
    <div id="ptm-cursor-dot" aria-hidden="true"></div>
    <div id="ptm-cursor-ring" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function () {
        'use strict';

        var GOLD = '#d4a853';
        var PURPLE = '#9c77b7';

        function lerp(a, b, t) {
          return a + (b - a) * t;
        }

        function easeOutQuart(t) {
          return 1 - Math.pow(1 - t, 4);
        }

        function waitFor(selector, timeout) {
          timeout = timeout || 20000;
          return new Promise(function (resolve, reject) {
            var start = Date.now();
            var rafId = 0;
            var done = false;
            function finish(fn, value) {
              if (done) return;
              done = true;
              cancelAnimationFrame(rafId);
              fn(value);
            }
            function tick() {
              var el = document.querySelector(selector);
              if (el) return finish(resolve, el);
              if (Date.now() - start > timeout) return finish(reject, new Error('timeout: ' + selector));
              rafId = requestAnimationFrame(tick);
            }
            rafId = requestAnimationFrame(tick);
          });
        }

        /* 1. Loading screen */
        (function initLoader() {
          var loader = document.getElementById('ptm-loader');
          if (!loader) return;
          setTimeout(function () {
            loader.classList.add('ptm-loader-hide');
            setTimeout(function () {
              if (loader.parentNode) loader.parentNode.removeChild(loader);
            }, 500);
          }, 2200);
        })();

        /* App-dependent features after React mount */
        function initAppFeatures() {
          waitFor('main section').then(function () {
            var servicesSection = document.getElementById('services');

            if (servicesSection) {
              initStaggerReveal(servicesSection);
              initPriceCountUp(servicesSection);
              initDurationToggle(servicesSection);
            }
          }).catch(function () {});
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', initAppFeatures);
        } else {
          initAppFeatures();
        }

        /* 6. Stagger reveal on service cards */
        function getServiceCards(section) {
          var container = section.querySelector('.space-y-8');
          if (!container) return [];
          return Array.prototype.slice.call(container.children);
        }

        function initStaggerReveal(section) {
          var cards = getServiceCards(section);
          if (!cards.length) return;

          var delays = [0.05, 0.18, 0.31];
          cards.forEach(function (card, i) {
            card.classList.add('ptm-card-reveal');
            card.style.transitionDelay = (delays[i % delays.length]) + 's';
          });

          var observer = new IntersectionObserver(function (entries) {
            entries.forEach(function (entry) {
              if (entry.isIntersecting) {
                entry.target.classList.add('ptm-card-visible');
                observer.unobserve(entry.target);
              }
            });
          }, { threshold: 0.12 });

          cards.forEach(function (card) { observer.observe(card); });
        }

        /* 7. Price count-up */
        function parsePrice(text) {
          var n = parseInt(String(text).replace(/[^0-9]/g, ''), 10);
          return isNaN(n) ? 0 : n;
        }

        function animatePrice(el, finalValue, duration) {
          duration = duration || 800;
          if (el._ptmPriceRaf) cancelAnimationFrame(el._ptmPriceRaf);
          var start = null;
          function step(ts) {
            if (!start) start = ts;
            var p = Math.min((ts - start) / duration, 1);
            var val = Math.round(easeOutQuart(p) * finalValue);
            el.textContent = '$' + val;
            if (p < 1) {
              el._ptmPriceRaf = requestAnimationFrame(step);
            } else {
              el._ptmPriceRaf = 0;
              el.textContent = '$' + finalValue;
            }
          }
          el._ptmPriceRaf = requestAnimationFrame(step);
        }

        function getPriceSpan(card) {
          var h4 = card.querySelector('h4');
          if (!h4) return null;
          var spans = h4.querySelectorAll('span');
          for (var i = 0; i < spans.length; i++) {
            if (/\$/.test(spans[i].textContent)) return spans[i];
          }
          return null;
        }

        function initPriceCountUp(section) {
          var cards = getServiceCards(section);
          cards.forEach(function (card) {
            var priceEl = getPriceSpan(card);
            if (!priceEl || priceEl.dataset.ptmCounted) return;
            var finalVal = parsePrice(priceEl.textContent);
            if (!finalVal) return;

            var observer = new IntersectionObserver(function (entries) {
              entries.forEach(function (entry) {
                if (entry.isIntersecting) {
                  priceEl.dataset.ptmCounted = '1';
                  priceEl.dataset.ptmFinal = String(finalVal);
                  animatePrice(priceEl, finalVal, 800);
                  observer.unobserve(card);
                }
              });
            }, { threshold: 0.12 });
            observer.observe(card);
          });
        }

        /* 9. Duration toggle (60min / 90min) */
        function getDurationFromCard(card) {
          var h4 = card.querySelector('h4');
          if (!h4) return '';
          var m = h4.textContent.match(/(\d+)\s*MINS/i);
          return m ? m[1] : '';
        }

        function initDurationToggle(section) {
          var cards = getServiceCards(section);
          var has60 = cards.some(function (c) { return getDurationFromCard(c) === '60'; });
          var has90 = cards.some(function (c) { return getDurationFromCard(c) === '90'; });
          if (!has60 || !has90) return;

          var container = section.querySelector('.space-y-8');
          if (!container || document.getElementById('ptm-duration-toggle')) return;

          var toggle = document.createElement('div');
          toggle.id = 'ptm-duration-toggle';
          toggle.innerHTML =
            '<button type="button" data-dur="60" class="ptm-dur-active">60min</button>' +
            '<button type="button" data-dur="90">90min</button>';
          container.parentNode.insertBefore(toggle, container);

          var activeDur = '60';

          function highlightCard(dur) {
            cards.forEach(function (card) {
              card.classList.remove('ptm-duration-highlight');
              if (getDurationFromCard(card) === dur) {
                card.classList.add('ptm-duration-highlight');
                var priceEl = getPriceSpan(card);
                if (priceEl) {
                  var finalVal = parsePrice(priceEl.dataset.ptmFinal || priceEl.textContent);
                  priceEl.dataset.ptmFinal = String(finalVal);
                  animatePrice(priceEl, finalVal, 800);
                }
              }
            });
          }

          toggle.addEventListener('click', function (e) {
            var btn = e.target.closest('button[data-dur]');
            if (!btn) return;
            activeDur = btn.getAttribute('data-dur');
            toggle.querySelectorAll('button').forEach(function (b) {
              b.classList.toggle('ptm-dur-active', b === btn);
            });
            highlightCard(activeDur);
          });

          highlightCard('60');

          var mo = new MutationObserver(function () {
            cards = getServiceCards(section);
            highlightCard(activeDur);
            initPriceCountUp(section);
          });
          mo.observe(container, { childList: true });
        }
      })();
    </script>
